<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-it dashboard</title>
<style>
  /* One accent, hot pink (dark ink on it passes contrast in both themes); skip is a warm red so it never reads as
     the accent. Bahnschrift (ships with Windows) is the condensed broadcast face for names, numbers and controls;
     body text stays the system UI face. */
  :root {
    color-scheme: light dark;
    --bg: #f4f3f8; --panel: #ffffff; --raise: #ecebf3; --line: #dddbe8; --text: #191624; --muted: #625d75;
    --hl: #f0388f; --hl-ink: #191624;
    --keep: #0f7a4f; --keep-bg: #d7f5e7; --skip: #c2361f; --skip-bg: #ffe3dc; --warn: #8a5a00; --warn-bg: #fff1c7;
    --link: #4b3fbf; --focus: #6d5ae6;
    --shadow: 0 1px 2px rgb(25 22 36 / 0.06), 0 12px 32px -12px rgb(25 22 36 / 0.25);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --cond: "Bahnschrift", "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15131d; --panel: #1d1a28; --raise: #262234; --line: #322d44; --text: #f1eff7; --muted: #a29db3;
      --hl: #ff5cad;
      --keep: #4ade9b; --keep-bg: #173a2c; --skip: #ff7a5c; --skip-bg: #45201a; --warn: #fcd34d; --warn-bg: #3d2f12;
      --link: #b3a8ff; --focus: #ff5cad;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 18px 40px -16px rgb(0 0 0 / 0.7);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { margin: 0; line-height: 1.15; }
  button:disabled { opacity: 0.35; cursor: default; }

  /* Header: wordmark, underlined tabs, a live dot */
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 2rem; padding: 0 1.25rem;
           background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--line); }
  h1 { font: 700 1.35rem/1 var(--cond); letter-spacing: -0.01em; }
  h1 span { background: var(--hl); color: var(--hl-ink); padding: 0 0.2em; border-radius: 3px; }
  [role=tablist] { display: flex; gap: 0.25rem; align-self: stretch; }
  [role=tab] { position: relative; border: 0; background: none; padding: 1rem 0.75rem; color: var(--muted);
               font: 600 1rem/1 var(--cond); letter-spacing: 0.01em; }
  [role=tab]:hover { color: var(--text); }
  [role=tab][aria-selected=true] { color: var(--text); }
  [role=tab][aria-selected=true]::after { content: ""; position: absolute; inset: auto 0.75rem -1px; height: 3px; border-radius: 3px 3px 0 0;
                                         background: var(--hl); }
  #status { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0 auto; font-size: 0.85rem; color: var(--muted); }
  #status::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--keep);
                    box-shadow: 0 0 0 3px var(--keep-bg); }
  #status.bad { color: var(--skip); font-weight: 600; }
  #status.bad::before { background: var(--skip); box-shadow: 0 0 0 3px var(--skip-bg); }

  main { padding: 1.5rem 1.25rem 3rem; max-width: 1360px; margin: 0 auto; }

  /* Shared controls */
  .ghost, button.toggle, .upload button { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.4rem 0.8rem;
           border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text);
           font: 600 0.9rem/1.2 var(--cond); letter-spacing: 0.01em; text-decoration: none;
           transition: transform 140ms var(--ease-out), background-color 140ms ease; }
  .ghost:active, button.toggle:active, .upload button:active, .big:active:not(:disabled) { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) {
    .ghost:hover, button.toggle:hover, .upload button:hover { background: var(--raise); }
  }
  kbd { display: inline-grid; place-items: center; min-width: 1.4em; padding: 0 0.3em; border: 1px solid currentColor;
        border-radius: 4px; font: 600 0.75em/1.4 var(--cond); opacity: 0.7; }
  .meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; color: var(--muted); font-size: 0.875rem; }
  .meta b { color: var(--text); font-weight: 600; }

  /* Review: video on the left, the clip's story on the right */
  .review { display: grid; grid-template-columns: auto minmax(0, 26rem); justify-content: center; gap: 1.5rem 3rem; align-items: start; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  #deck { display: grid; place-items: center; }
  #deck > * { grid-area: 1 / 1; }
  .card { position: relative; height: min(72vh, 680px); aspect-ratio: 9 / 16; max-width: calc(100vw - 2.5rem); border-radius: 16px;
          overflow: hidden; background: #000; box-shadow: var(--shadow); touch-action: pan-y; user-select: none; cursor: grab;
          transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out); }
  .card.top { @starting-style { transform: scale(0.95) translateY(16px); opacity: 0.6; } }
  .card.dragging { cursor: grabbing; }
  .card.back { transform: scale(0.95) translateY(16px); opacity: 0.45; pointer-events: none; box-shadow: none; background: var(--raise); }
  .card video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .card.paused::after { content: "▶"; position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 4.5rem; height: 4.5rem;
                        margin: -2.25rem 0 0 -2.25rem; padding-left: 0.3rem; border-radius: 50%; font-size: 1.6rem; color: #fff;
                        background: rgb(0 0 0 / 0.45); backdrop-filter: blur(6px); pointer-events: none; }
  .progress { position: absolute; inset: auto 0 0 0; height: 4px; background: rgb(255 255 255 / 0.2); pointer-events: none; }
  .progress i { display: block; height: 100%; background: var(--hl); transform-origin: left; transform: scaleX(0); }
  .stamp { position: absolute; top: 1.5rem; padding: 0.1rem 0.7rem; border: 4px solid; border-radius: 10px;
           font: 700 2.25rem/1.1 var(--cond); letter-spacing: 0.04em; background: rgb(0 0 0 / 0.3); opacity: 0; pointer-events: none; }
  .stamp.keep { left: 1.25rem; color: #4ade9b; transform: rotate(-10deg); }
  .stamp.skip { right: 1.25rem; color: #ff7a5c; transform: rotate(10deg); }
  .sound { position: absolute; right: 0.75rem; bottom: 1rem; z-index: 1; padding: 0.35rem 0.7rem; border: 0; border-radius: 999px;
           background: rgb(0 0 0 / 0.55); color: #fff; font: 600 0.8rem/1.2 var(--cond); backdrop-filter: blur(6px); }
  .deck-actions { display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 1.25rem; }
  .big { display: inline-flex; align-items: center; gap: 0.6rem; min-width: 8.5rem; justify-content: center; padding: 0.8rem 1.25rem;
         border: 2px solid currentColor; border-radius: 999px; background: var(--panel); font: 700 1.1rem/1 var(--cond);
         transition: transform 140ms var(--ease-out), background-color 140ms ease; }
  .big.keep { color: var(--keep); }
  .big.skip { color: var(--skip); }
  @media (hover: hover) and (pointer: fine) {
    .big.keep:hover:not(:disabled) { background: var(--keep-bg); }
    .big.skip:hover:not(:disabled) { background: var(--skip-bg); }
  }
  #side { padding-top: 0.5rem; }
  .left { margin: 0 0 1.25rem; font: 600 0.95rem/1 var(--cond); color: var(--muted); }
  .left b { font-size: 1.6rem; color: var(--text); margin-right: 0.3rem; }
  #side h2 { font: 700 clamp(1.6rem, 2.6vw, 2.2rem)/1.08 var(--cond); letter-spacing: -0.01em; text-wrap: balance; }
  #side .meta { margin: 0.75rem 0 1.25rem; }
  .hook { display: inline; padding: 0.15em 0.35em; background: var(--hl); color: var(--hl-ink); border-radius: 4px;
          font: 700 1.05rem/1.7 var(--cond); text-transform: uppercase; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .why { margin: 1.25rem 0 0; color: var(--muted); max-width: 60ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
  .keys { margin: 2rem 0 0; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; color: var(--muted); font-size: 0.85rem; }
  .done-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; width: min(26rem, 100%);
               min-height: 20rem; padding: 2rem; border: 2px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); }
  .done-card b { font: 700 1.75rem/1.1 var(--cond); color: var(--text); }

  /* Clips: filter chips, list, detail */
  #stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  .stat { display: inline-flex; align-items: baseline; gap: 0.5rem; padding: 0.45rem 0.9rem; border: 1px solid var(--line); border-radius: 999px;
          background: var(--panel); color: var(--muted); font: 600 0.95rem/1.2 var(--cond); }
  .stat b { color: var(--text); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .stat[aria-pressed=true] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .stat[aria-pressed=true] b { color: var(--hl); }
  @media (hover: hover) and (pointer: fine) { .stat[aria-pressed=false]:hover { background: var(--raise); } }

  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  .toolbar input, .toolbar select, .upload input { padding: 0.45rem 0.7rem; border: 1px solid var(--line); border-radius: 8px;
                                                    background: var(--panel); min-width: 0; }
  .toolbar input { flex: 1 1 16rem; }
  #count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); gap: 1.25rem; align-items: start; }
  #list { list-style: none; margin: 0; padding: 0.25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .row { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) auto; gap: 0.875rem; align-items: center; width: 100%;
         padding: 0.6rem 0.75rem; border: 0; border-radius: 8px; background: none; text-align: left; }
  @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--raise); } }
  .row[aria-current=true] { background: var(--raise); box-shadow: inset 3px 0 0 var(--hl); }
  .score { display: grid; place-items: center; height: 2.75rem; border-radius: 8px; background: var(--raise);
           font: 700 1.25rem/1 var(--cond); font-variant-numeric: tabular-nums; }
  .score.hot { background: var(--hl); color: var(--hl-ink); }
  .main { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .title { font: 600 1.05rem/1.25 var(--cond); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.25rem; }
  .badge { padding: 0.15rem 0.55rem; border-radius: 999px; font: 600 0.8rem/1.3 var(--cond); white-space: nowrap;
           background: var(--raise); color: var(--muted); }
  .badge.keep, .badge.posted, .badge.done { background: var(--keep-bg); color: var(--keep); }
  .badge.skip, .badge.failed { background: var(--skip-bg); color: var(--skip); }
  .badge.processing { background: var(--warn-bg); color: var(--warn); }
  .empty { padding: 2.5rem 1rem; color: var(--muted); text-align: center; }

  #detail { position: sticky; top: 4.5rem; max-height: calc(100vh - 5.5rem); overflow: auto; padding: 1.25rem;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #player video { display: block; height: min(50vh, 540px); aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto 1.25rem;
                  background: #000; border-radius: 12px; object-fit: contain; }
  .detail-head { display: flex; gap: 0.75rem; align-items: flex-start; justify-content: space-between; }
  #info h2 { font: 700 1.4rem/1.15 var(--cond); }
  #info > .meta { margin-top: 0.5rem; }
  #info h3 { font: 700 1.05rem/1.2 var(--cond); margin: 1.5rem 0 0.25rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .label { font: 600 0.95rem/1.2 var(--cond); min-width: 5.5rem; }
  .group, .upload { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
  .upload + .upload { margin-top: 0.5rem; }
  .upload input { flex: 1 1 10rem; }
  .toggle.keep[aria-pressed=true] { background: var(--keep-bg); color: var(--keep); border-color: currentColor; }
  .toggle.skip[aria-pressed=true] { background: var(--skip-bg); color: var(--skip); border-color: currentColor; }
  .path { margin: 0.5rem 0 0; overflow-wrap: anywhere; }
  .copy { margin-top: 0.875rem; }
  .copy-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; }
  .copy-head .ghost { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
  pre { margin: 0; padding: 0.6rem 0.75rem; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.875rem/1.5 var(--body);
        background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  details { margin-top: 1.5rem; }
  summary { cursor: pointer; font: 600 1rem/1.2 var(--cond); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 0.875rem; margin: 0.75rem 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }

  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.65rem 0.9rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font: 600 0.9rem/1.2 var(--cond); color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .error { margin-top: 0.25rem; color: var(--skip); font-size: 0.85rem; overflow-wrap: anywhere; }

  @media (max-width: 960px) {
    .review { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    #side { width: 100%; max-width: 32rem; padding-top: 0; }
    .keys { display: none; }
  }
  @media (max-width: 860px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    #detail { position: static; max-height: none; order: -1; }
    .split:not(.has-detail) #detail { display: none; }
    .row { grid-template-columns: 2.75rem minmax(0, 1fr); }
    .badges { grid-column: 2; justify-content: flex-start; }
  }
  @media (max-width: 560px) {
    header { gap: 0.75rem; padding: 0 1rem; }
    [role=tab] { padding: 1rem 0.5rem; }
    main { padding: 1rem 1rem 2rem; }
    .card { height: min(64vh, 640px); }
    .big { min-width: 0; padding: 0.75rem 1rem; }
    .big kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .ghost, .big { transition: opacity 150ms ease; }
    .card.top { @starting-style { transform: none; opacity: 0; } }
  }
</style>
</head>
<body>
<header>
  <h1>clip<span>it</span></h1>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" id="review-tab" aria-selected="true" aria-controls="review-panel">Review</button>
    <button role="tab" id="clips-tab" aria-selected="false" aria-controls="clips-panel">Clips</button>
    <button role="tab" id="vods-tab" aria-selected="false" aria-controls="vods-panel">VODs</button>
  </nav>
  <p id="status" role="status">Loading…</p>
</header>
<main>
  <section id="review-panel" role="tabpanel" aria-labelledby="review-tab">
    <div class="review">
      <div class="stage">
        <div id="deck" aria-live="polite"></div>
        <div class="deck-actions">
          <button type="button" class="big skip" id="skip"><kbd>←</kbd> Skip</button>
          <button type="button" class="ghost" id="undo"><kbd>Z</kbd> Undo</button>
          <button type="button" class="big keep" id="keep">Keep <kbd>→</kbd></button>
        </div>
      </div>
      <div id="side">
        <p class="left" id="left">Loading…</p>
        <div id="story"></div>
        <div class="tools" id="tools"></div>
        <p class="keys"><span>Drag the clip right to keep, left to skip</span><span><kbd>Space</kbd> play or pause</span></p>
      </div>
    </div>
  </section>
  <section id="clips-panel" role="tabpanel" aria-labelledby="clips-tab" hidden>
    <div id="stats" role="group" aria-label="Show clips"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search titles, captions, streamers" aria-label="Search clips">
      <select id="streamer" aria-label="Streamer"></select>
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="score">Best AI score</option>
        <option value="streamer">By streamer</option>
      </select>
      <span id="count"></span>
    </div>
    <div class="split" id="split">
      <ul id="list" aria-label="Clips"></ul>
      <aside id="detail" aria-label="Selected clip">
        <div id="player"></div>
        <div id="info"></div>
      </aside>
    </div>
  </section>
  <section id="vods-panel" role="tabpanel" aria-labelledby="vods-tab" hidden>
    <div class="table-wrap">
      <table>
        <thead><tr><th>VOD</th><th>Streamer</th><th>Status</th><th>Clips</th><th>Tier</th><th>Finished</th></tr></thead>
        <tbody id="vods"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
