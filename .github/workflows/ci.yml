name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # macOS: the production machine is an M-series Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (versions pinned by requirements.lock)
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
