name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Branch is <type>/<short-name>
        env:
          BRANCH: ${{ github.head_ref }}  # via env, never inlined into the script: branch names are user input
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix|refactor|test)/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Branch '$BRANCH' must be <type>/<short-name>, type one of feat, fix, refactor, test (e.g. fix/stale-claim)"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # macOS: the production machine is an M-series Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4  # tests/test_dashboard.py runs dashboard.js under Node
        with:
          node-version: "22"
      - name: Install (versions pinned by requirements.lock)
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: pyright
      - name: Test
        run: pytest -q
